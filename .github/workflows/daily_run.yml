name: Daily ESN Engine

on:
  schedule:
    - cron: "30 23 * * 1-5"   # 21:30 UTC Mon–Fri (after US market close)
  workflow_dispatch:
    inputs:
      universe:
        description: "Universe to run (ALL / EQUITY_SECTORS / COMBINED)"
        required: false
        default: "ALL"

jobs:
  run-esn:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      matrix:
        universe: [EQUITY_SECTORS, COMBINED]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ESN engine — ${{ matrix.universe }}
        env:
          HF_TOKEN:     ${{ secrets.HF_TOKEN }}
          ESN_UNIVERSE: ${{ matrix.universe }}
        run: python trainer.py
